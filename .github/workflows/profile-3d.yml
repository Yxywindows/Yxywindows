name: GitHub-Profile-3D-Contrib

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Hide donut chart and radar chart
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          # Keep SVG tags unprefixed for GitHub image previews.
          ET.register_namespace("", "http://www.w3.org/2000/svg")
          ET.register_namespace("xlink", "http://www.w3.org/1999/xlink")

          def local_name(tag):
              return tag.split("}", 1)[-1] if "}" in tag else tag

          radar_keywords = {"Commit", "Issue", "PullReq", "Review", "Repo"}

          for file in Path("profile-3d-contrib").glob("*.svg"):
              try:
                  tree = ET.parse(file)
                  root = tree.getroot()
                  if root.tag != "{http://www.w3.org/2000/svg}svg":
                      raise ValueError(f"Not a valid SVG root: {file}")
                  parent_map = {child: parent for parent in root.iter() for child in parent}

                  groups_to_remove = []

                  for elem in root.iter():
                      if local_name(elem.tag) != "g":
                          continue

                      texts = []
                      for sub in elem.iter():
                          if local_name(sub.tag) == "text":
                              txt = "".join(sub.itertext()).strip()
                              if txt:
                                  texts.append(txt)

                      text_set = set(texts)
                      transform = elem.attrib.get("transform", "")

                      # 1) 删除左下角 donut 区块
                      if transform == "translate(40, 520)" or "other" in text_set:
                          groups_to_remove.append(elem)
                          continue

                      # 2) 删除右上角雷达图区块
                      if radar_keywords.issubset(text_set):
                          groups_to_remove.append(elem)
                          continue

                  # 实际移除
                  removed = set()
                  for elem in groups_to_remove:
                      if elem in removed:
                          continue
                      parent = parent_map.get(elem)
                      if parent is not None:
                          parent.remove(elem)
                          removed.add(elem)

                  tree.write(file, encoding="utf-8", xml_declaration=False)
                  print(f"Processed: {file}")
              except Exception as e:
                  print(f"Failed: {file} -> {e}")
                  raise
          PY

      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          if git commit -m "Update 3D contributions"; then
            git push
          fi
